services:
  postgres:
    image: postgres:16-alpine
    container_name: vagon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vagon_db
      POSTGRES_USER: vagon_user
      POSTGRES_PASSWORD: vagon_pass_change_this
    ports:
      - "5432:5432"
    volumes:
      - vagon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vagon_user -d vagon_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vagon_pgdata:
